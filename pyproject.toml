[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-docs-mcp"
version = "0.1.0"
description = "Vendor-neutral MCP server that sends Gmail and appends to Google Docs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "httplib2>=0.22",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
gmail-docs-mcp = "gmail_docs_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
